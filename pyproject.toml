[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biopython-mpro-atlas"
version = "0.3.0"
description = "Trace coronavirus M-pro to UniProt/PDB and validate domain coverage with SIFTS"
requires-python = ">=3.10"
dependencies = ["biopython>=1.81,<2", "requests>=2.31,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mpro-atlas = "mpro_atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
